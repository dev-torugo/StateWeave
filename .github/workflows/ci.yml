name: StateWeave CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stateweave-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Static checks, contracts, tests, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Install package and development tools
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Run canonical gate
        run: bash scripts/check.sh

      - name: Run static checks
        run: |
          ruff format --check src tests scripts
          ruff check src tests scripts
          mypy --python-version 3.11 src/stateweave

      - name: Build distributions
        run: python -m build

  portability:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
          - windows-2025
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: python -m pip install --disable-pip-version-check .

      - name: Validate contracts
        run: python scripts/check_contract.py

      - name: Run complete test suite
        run: python -m unittest discover -s tests -v
