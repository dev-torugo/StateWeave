schema_version = 1

[project]
id = "service-team"
name = "Synthetic Service Team"

[paths]
facts = "memory/facts"
decisions = "memory/decisions"
state = "memory/state/current.json"
metadata = ".stateweave"
backups = ".stateweave/backups"
migrations = ".stateweave/migrations"
extensions = ".stateweave/extensions"

[memory]
default_fact_class = "general"
no_expiry_classes = ["immutable"]

[memory.ttl_days]
volatile = 14
general = 60
policy = 120

[roles]
allowed = ["maintainer", "reviewer", "operator"]

[limits]
max_record_bytes = 131072
max_records = 10000
max_state_items = 100
lock_timeout_seconds = 3.0
lock_stale_after_seconds = 600

[policy]
allowed_classifications = ["public", "internal"]
review_warning_days = 7
enforce_ttl_ceiling = true
fail_on_stale_verified = true
require_reciprocal_supersession = true
detect_structured_conflicts = true
